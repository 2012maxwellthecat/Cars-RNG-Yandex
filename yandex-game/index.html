<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#141821" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Cars RNG</title>
    <!-- Yandex Games SDK -->
    <!-- В production (yandex.net) загружается настоящий SDK -->
    <!-- В development (localhost) загружается mock SDK -->
    <script>
      // Проверка окружения
      const isYandexEnvironment = window.location.hostname.includes('yandex.net') ||
                                   window.location.hostname.includes('yandex.ru');

      if (isYandexEnvironment) {
        // Production: загружаем настоящий Yandex Games SDK
        document.write('<script src="https://yandex.ru/games/sdk/v2"><\/script>');
      } else {
        // Development: загружаем mock SDK
        document.write('<script src="/sdk.js"><\/script>');
      }
    </script>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
