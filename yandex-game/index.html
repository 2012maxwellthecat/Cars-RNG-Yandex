<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#141821" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Cars RNG</title>
    <!-- Yandex Games SDK -->
    <!-- Локальный адрес: mock SDK из public/sdk.js. Всё остальное: настоящий SDK -->
    <script>
      /*
       * Проверяем именно локальные адреса, а не домены Яндекса.
       * Раньше условие было обратным (hostname содержит yandex.net/yandex.ru),
       * и любая неожиданная хостовая схема роняла игру на mock SDK — то есть
       * в продакшене показывался выдуманный лидерборд вместо настоящего.
       * Теперь ошибка условия приводит к загрузке настоящего SDK, а не подделки.
       */
      var host = window.location.hostname;
      var isLocalHost =
        host === 'localhost' ||
        host === '127.0.0.1' ||
        host === '::1' ||
        host === '' ||
        host.endsWith('.local') ||
        /^192\.168\./.test(host) ||
        /^10\./.test(host) ||
        /^172\.(1[6-9]|2[0-9]|3[01])\./.test(host);

      if (isLocalHost) {
        document.write('<script src="/sdk.js"><\/script>');
      } else {
        document.write('<script src="https://yandex.ru/games/sdk/v2"><\/script>');
      }
    </script>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
